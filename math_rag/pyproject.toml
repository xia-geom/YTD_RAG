[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-rag"
version = "0.1.0"
description = "Local-first retrieval assistant for mathematical research documents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Local Research Project" }]
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6",
]

[project.optional-dependencies]
pdf = [
  "pypdf>=4",
]
remote-mcp = [
  "fastmcp>=2",
  "uvicorn>=0.30",
]
dev = [
  "pytest>=8",
]

[project.scripts]
math-rag = "math_rag.cli:main"
math-rag-mcp-remote = "math_rag.remote_mcp_server:main"
math-rag-mcp-http = "math_rag.mcp_http_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
