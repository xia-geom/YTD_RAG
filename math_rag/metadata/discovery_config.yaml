arxiv_categories:
  - "math.DG"
  - "math.AG"
  - "math.CV"

ranking_weights:
  keyword_match: 3.0
  author_match: 2.5
  title_match: 2.0
  abstract_match: 1.5
  category_match: 1.0
  recency: 0.5
  blacklist_penalty: -10.0
  whitelist_bonus: 5.0

download_policy:
  require_approval: true
  max_papers_per_run: 20
  delay_seconds_between_requests: 3
  download_source: true
  download_pdf: true
  avoid_duplicates: true

manual_whitelist: []
manual_blacklist: []

exclude_low_confidence_by_default: true
